title: AWS CloudTrail Important Change
id: 4db60cc0-36fb-42b7-9b58-a5b53019fb74
status: test
description: Detects disabling, deleting and updating of a Trail
references:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/best-practices-security.html
author: vitaliy0x1
date: 2020/01/21
modified: 2022/10/09
tags:
    - attack.defense_evasion
    - attack.t1562.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_source:
        eventSource: cloudtrail.amazonaws.com
        eventName:
            - StopLogging
            - UpdateTrail
            - DeleteTrail
    selection_encoded:
        yo: hiii
    selection_yo:
        yo2: hi
    condition: selection_source
risk_score:
    default: 50
    scores:
        all of selection_*: 100
        selection_source AND selected_yo: 40
        selection_source AND selection_encoded: 60
        selection_source AND NOT selection_encoded: 70
falsepositives:
    - Valid change in a Trail
level: medium
