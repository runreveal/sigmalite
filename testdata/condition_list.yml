title: Condition List Example
description: A contrived example for testing risk score evaluation.
logsource:
    product: windows
detection:
    selection1:
        EventID: 1
    selection2:
        EventID: 2
    selection3:
        EventID: 3
    filter:
        Message: ignore
    condition:
        - selection1
        - selection2
        - selection3 and not filter
